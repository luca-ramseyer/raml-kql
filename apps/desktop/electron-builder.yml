# electron-builder packaging config (spec 11). Phase 0: unsigned local installers only.
# Phase 11 adds signing, notarization, Electron fuses, auto-update metadata and all targets.
appId: ch.raml.kql
productName: Raml KQL
artifactName: Raml-KQL-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  # Explicitly unsigned until signing is configured in Phase 11 (see docs/HUMAN-TODO.md).
  identity: null
win:
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
linux:
  target: [AppImage, deb, rpm]
  category: Development
  maintainer: Raml KQL contributors
