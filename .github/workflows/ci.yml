# Continuous integration (spec 11). Explained for humans in docs/guides/testing-and-ci-explained.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits to scan them
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so gitleaks scans every commit

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6 # pnpm version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        env:
          # Type-aware ESLint over the whole monorepo needs more than Node's default heap.
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm typecheck
      - run: pnpm test --coverage
      - run: pnpm check:licenses

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end tests (demo mode)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      # Re-allow them on the CI runner so the app runs *with* its sandbox (never --no-sandbox).
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Electron needs a display; xvfb provides a virtual one.
      - run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 7

  build-matrix:
    name: Package (${{ matrix.os }})
    needs: check
    # macOS runners cost 10x the minutes on private repos: only build installers on main,
    # or on PRs labelled "full-ci". Run on every PR once the repo is public.
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - run: pnpm dist
        env:
          # Unsigned builds: stop electron-builder from looking for signing identities.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # The built-in Entra client ID (a public identifier, kept as a secret so it stays out
          # of logs). Empty for PRs from forks: those builds offer custom client ID and Azure CLI.
          RAML_KQL_CLIENT_ID: ${{ secrets.RAML_KQL_CLIENT_ID }}

      # The unit and e2e tests run the unpackaged app. This starts the real packaged one, so a
      # broken fuse or signature (the app builds, then dies at start) fails the build.
      - name: Smoke test the packaged app
        if: runner.os != 'Linux'
        run: pnpm smoke:packaged
      - name: Smoke test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum pnpm smoke:packaged

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error
          retention-days: 7
