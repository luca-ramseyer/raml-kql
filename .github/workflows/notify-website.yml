# Copy this file to the APP repo (luca-ramseyer/raml-kql) as .github/workflows/notify-website.yml.
# It tells the website repo to rebuild when the docs change or a release is published.
#
# One-time setup (see the website README, "App-repo dispatch"):
#   1. Create a fine-grained personal access token. Resource owner: you. Repository access: ONLY
#      luca-ramseyer/raml-kql-web. Permissions: Contents = Read and write (this is what GitHub
#      requires for repository_dispatch). Nothing else.
#   2. In the app repo: Settings > Secrets and variables > Actions > New repository secret.
#      Name: WEBSITE_DISPATCH_TOKEN. Value: the token.
name: Notify website

on:
  push:
    branches: [main]
    paths: ['docs/**']
  # The Release workflow publishes with the default GITHUB_TOKEN, and events caused by that token
  # do not trigger other workflows, so "release: published" would never fire. Listen for the
  # Release workflow finishing instead. TODO(luca): keep `workflows` equal to the `name:` in release.yml.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # For workflow_run, only continue when the Release workflow succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Skip when no release was published recently
        id: gate
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Release workflow also runs on every push to main. Only rebuild the website
          # when a release was published in the last 3 hours.
          published=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .published_at 2>/dev/null || true)
          if [ -z "$published" ] || [ $(( $(date +%s) - $(date -d "$published" +%s) )) -gt 10800 ]; then
            echo "No recent release; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger website rebuild
        if: steps.gate.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/luca-ramseyer/raml-kql-web/dispatches \
            -d '{"event_type":"docs-updated","client_payload":{"source":"${{ github.event_name }}","sha":"${{ github.sha }}"}}'
